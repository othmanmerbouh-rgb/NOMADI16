<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EURL NOMADI DISTRIBUTION - Catalogue Produits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>

    :root {
      --navy: #0E1B32;
      --navy-2: #16264A;
      --teal: #0EA8A0;
      --teal-dark: #0B8580;
      --amber: #E8A33D;
      --paper: #F4F6F8;
      --card: #FFFFFF;
      --ink: #1B2333;
      --muted: #6B7385;
      --line: #E4E8EE;
      --danger: #D64545;
      --success: #1F9D5A;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(14, 27, 50, 0.06);
      --shadow-md: 0 10px 30px rgba(14, 27, 50, 0.10);
      --shadow-lg: 0 20px 50px rgba(14, 27, 50, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* ---------- Header ---------- */
    header {
      background: var(--navy);
      padding: 18px 24px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shadow-md);
    }
    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand .brand-name {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.3px;
    }
    .brand .brand-sub {
      font-size: 11.5px;
      color: var(--teal);
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .whatsapp-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1FAF54;
      color: white;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(31, 175, 84, 0.35);
    }
    .whatsapp-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(31, 175, 84, 0.45); }
    .toggle-price-btn {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.28);
      padding: 8px 17px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .toggle-price-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }

    .price-hidden .product .price-tag,
    .price-hidden .product-specs { display: none; }

    /* ---------- Search ---------- */
    .search-bar-wrap {
      max-width: 1320px;
      margin: 26px auto 0;
      padding: 0 24px;
    }
    .search-container { position: relative; max-width: 640px; margin: 0 auto; }
    .search-container input {
      width: 100%;
      padding: 14px 50px 14px 20px;
      font-size: 14.5px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow-sm);
      outline: none;
      font-family: inherit;
      color: var(--ink);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .search-container input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(14, 168, 160, 0.14);
    }
    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
    }

    .content-wrapper { max-width: 1320px; margin: 0 auto; padding: 26px 24px 20px; }

    /* ---------- Search results ---------- */
    #searchResultsSection { display: none; margin-bottom: 30px; }
    .search-results-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .search-results-head h2 {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
    }
    .search-results-head span {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .no-results {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      background: var(--card);
      border-radius: var(--radius-lg);
      font-size: 14px;
      box-shadow: var(--shadow-sm);
    }

    /* ---------- Category grid (accordion) ---------- */
    #categoriesContainer h1.section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .categories-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .category-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      border: 1px solid var(--line);
      transition: box-shadow 0.25s ease;
    }
    .category-card.open { box-shadow: var(--shadow-md); }
    .category-header {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-align: right;
    }
    .category-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(14,168,160,0.12), rgba(14,168,160,0.05));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }
    .category-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .category-name-ar { font-size: 15px; font-weight: 700; color: var(--ink); }
    .category-name-fr { font-size: 12px; color: var(--muted); font-weight: 500; }
    .category-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--teal-dark);
      background: rgba(14, 168, 160, 0.1);
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .chevron {
      color: var(--muted);
      font-size: 14px;
      transition: transform 0.3s ease;
      min-width: 14px;
      text-align: center;
    }
    .category-card.open .chevron { transform: rotate(90deg); color: var(--teal-dark); }
    .category-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .category-body-inner { padding: 4px 20px 22px; border-top: 1px solid var(--line); padding-top: 18px; }

    /* ---------- Products grid & card ---------- */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 14px;
    }
    .product {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .product:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); border-color: rgba(14,168,160,0.35); background: var(--card); }
    .brand-tag {
      font-size: 10px;
      color: var(--teal-dark);
      font-weight: 700;
      background: rgba(14, 168, 160, 0.1);
      padding: 4px 9px;
      border-radius: 6px;
      align-self: flex-start;
      letter-spacing: 0.3px;
    }
    .product-image {
      width: 100%;
      height: 130px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .product h4 {
      font-size: 12.5px;
      color: var(--ink);
      font-weight: 700;
      text-align: right;
      min-height: 32px;
      line-height: 1.4;
    }
    .product-specs {
      font-size: 12px;
      font-weight: 700;
      color: var(--navy-2);
      text-align: center;
      background: #fff;
      padding: 7px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }
    .price-tag {
      font-size: 13.5px;
      color: var(--navy);
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, rgba(232,163,61,0.16), rgba(232,163,61,0.06));
      padding: 6px;
      border-radius: var(--radius-sm);
    }
    .availability {
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
    }
    .availability.yes { color: var(--success); background: rgba(31, 157, 90, 0.1); }
    .availability.no { color: var(--danger); background: rgba(214, 69, 69, 0.1); }
    .quantity-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 2px;
    }
    .qty-btn {
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: background 0.2s ease;
    }
    .qty-btn:hover { background: var(--teal-dark); }
    .qty-display { min-width: 24px; text-align: center; font-weight: 700; color: var(--ink); font-size: 14px; }

    /* ---------- Cart badge ---------- */
    .cart-badge {
      position: fixed;
      bottom: 22px;
      left: 22px;
      background: var(--navy);
      color: white;
      padding: 14px 20px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 150;
      cursor: grab;
      user-select: none;
    }
    .cart-badge:active { cursor: grabbing; }
    .cart-info { display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
    .cart-info span { font-size: 11.5px; color: rgba(255,255,255,0.75); }
    #cart-amount { pointer-events: none; font-weight: 800; color: var(--amber); font-size: 14px; }
    #cart-count { font-size: 19px; font-weight: 800; color: #fff; }
    #checkout-btn {
      background: var(--teal);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    #checkout-btn:hover:not(:disabled) { background: var(--teal-dark); }
    #checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- Invoice modal ---------- */
    .invoiceModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(14, 27, 50, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .invoiceModal.show { display: flex; }
    .invoice-content {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .invoice-header-title { text-align: center; font-size: 19px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .invoice-number { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 20px; font-weight: 600; }
    .invoice-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 10px;
      background: var(--paper);
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 11.5px;
      margin-bottom: 8px;
      text-align: center;
      color: var(--muted);
    }
    .invoice-items { margin-bottom: 18px; }
    .invoice-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      text-align: center;
      align-items: center;
    }
    .invoice-product-details { display: flex; flex-direction: column; align-items: flex-start; text-align: right; gap: 4px; }
    .invoice-product-code {
      color: var(--teal-dark);
      font-size: 10px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      background: rgba(14, 168, 160, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .final-total {
      background: var(--navy);
      color: white;
      padding: 15px;
      border-radius: var(--radius-sm);
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 18px;
    }
    .final-total span { color: var(--amber); }
    .invoice-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .invoice-btn { padding: 11px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; transition: transform 0.15s ease; }
    .invoice-btn:hover { transform: translateY(-1px); }
    .copy-btn { background: var(--navy-2); color: white; }
    .whatsapp-action-btn { background: #1FAF54; color: white; }
    .close-btn { background: var(--line); color: var(--ink); }
    .copy-success {
      display: none;
      position: fixed;
      top: 20px; left: 50%; transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 14px 22px;
      border-radius: 10px;
      z-index: 2000;
      font-weight: 700;
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); }
      .invoice-header, .invoice-item { grid-template-columns: 1fr; gap: 5px; }
      .invoice-product-details { align-items: center; text-align: center; margin-bottom: 8px; }
      .invoice-content { padding: 22px; max-width: 92%; }
      .category-header { padding: 14px 16px; gap: 12px; }
      .invoice-buttons { grid-template-columns: 1fr 1fr; }
    }

  </style>
</head>

RE": {"icon": "🔥", "ar": "مراجل التدفئة", "fr": "Chaudières"}, "BAIN_D_HUIL": {"icon": "🛢️", "ar": "حمام الزيت", "fr": "Bain d'huile"}, "DEMO": {"icon": "📡", "ar": "عروض تجريبية", "fr": "Demo"}, "Produits": {"icon": "📦", "ar": "منتجات متنوعة", "fr": "Produits"}, "AUTRE": {"icon": "📦", "ar": "أخرى", "fr": "Autres"}};
const categoryOrder = ["SMART_PHONE", "ACCESOIR_PHONE", "SCOOTER", "PC", "INFORMATIQUE", "TV", "TELEVISION", "REFRIGIRATEUR", "COMBINEE", "CONGELATEUR", "CLIM", "CHAUFAGE", "MACHINE_A_LAVER", "LAVE_VAISSEL", "CUISINIERE", "FOUR", "FOUR_ELECTRIQUE", "ENCASTRABLE", "TABLE_DE_CUISSON", "HOTTE", "MICRO_ONDE", "PETRIN", "ROBOT", "PEM", "CUISSON", "DISTRIBUTEUR", "VENTILATEUR", "CHAUFFE_BAIN", "CHAUDIERE", "BAIN_D_HUIL", "DEMO", "Produits"];

let cart = {};
let cartTotal = 0;
let pricesVisible = true;
let openCategory = null;

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const productById = {};
for (const items of Object.values(products)) {
  for (const p of items) { productById[p.id] = p; }
}

function productCardHTML(p) {
  const availability = p.stock > 0 ? 'yes' : 'no';
  const availabilityText = p.stock > 0 ? 'متوفر' : 'غير متوفر';
  const safeName = escHtml(p.name);
  const safeBrand = escHtml(p.brand);
  const safeCode = escHtml(p.code);
  return `
    <div class="product">
      <div class="brand-tag">${safeBrand}</div>
      <img src="${p.img}" class="product-image" alt="${safeName}" onerror="this.style.display='none'">
      <h4>${safeName}</h4>
      <div class="product-specs">${safeCode}</div>
      <div class="price-tag">${p.price} DA</div>
      <div class="availability ${availability}">${availabilityText}</div>
      ${p.stock > 0 ? `
      <div class="quantity-controls">
        <button class="qty-btn" onclick="decreaseQty(${p.id})">−</button>
        <span class="qty-display" id="qty-${p.id}">0</span>
        <button class="qty-btn" onclick="increaseQty(${p.id})">+</button>
      </div>
      ` : ''}
    </div>
  `;
}

function togglePrices() {
  pricesVisible = !pricesVisible;
  const body = document.body;
  const btn = document.querySelector('.toggle-price-btn');
  if (pricesVisible) {
    body.classList.remove('price-hidden');
    btn.textContent = '🔒 إخفاء الأسعار';
  } else {
    body.classList.add('price-hidden');
    btn.textContent = '🔓 إظهار الأسعار';
  }
}

function renderProducts() {
  for (let [category, items] of Object.entries(products)) {
    const grid = document.getElementById(category + '-grid');
    if (grid) {
      grid.innerHTML = items.map(productCardHTML).join('');
    }
  }
}

function toggleCategory(key) {
  const card = document.getElementById('card-' + key);
  const body = document.getElementById('body-' + key);
  const isOpen = card.classList.contains('open');

  if (openCategory && openCategory !== key) {
    const prevCard = document.getElementById('card-' + openCategory);
    const prevBody = document.getElementById('body-' + openCategory);
    if (prevCard && prevBody) {
      prevCard.classList.remove('open');
      prevBody.style.maxHeight = null;
    }
  }

  if (isOpen) {
    card.classList.remove('open');
    body.style.maxHeight = null;
    openCategory = null;
  } else {
    card.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
    openCategory = key;
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function increaseQty(id) {
  const p = productById[id];
  if (!p) return;
  if (cart[id]) {
    cart[id].quantity++;
  } else {
    cart[id] = { name: p.name, price: p.price, code: p.code, quantity: 1 };
  }
  updateQtyDisplay(id);
  updateCart();
}

function decreaseQty(id) {
  if (cart[id] && cart[id].quantity > 0) {
    cart[id].quantity--;
    if (cart[id].quantity === 0) {
      delete cart[id];
    }
    updateQtyDisplay(id);
    updateCart();
  }
}

function updateQtyDisplay(id) {
  const display = document.getElementById(`qty-${id}`);
  if (display) {
    display.textContent = (cart[id]?.quantity || 0);
  }
  const displaySearch = document.getElementById(`qty-search-${id}`);
  if (displaySearch) {
    displaySearch.textContent = (cart[id]?.quantity || 0);
  }
}

function updateCart() {
  let totalCount = 0;
  let itemsCount = 0;
  cartTotal = 0;

  for (let [id, item] of Object.entries(cart)) {
    totalCount += item.quantity;
    itemsCount++;
    cartTotal += item.price * item.quantity;
  }

  document.getElementById('cart-count').textContent = totalCount;
  document.getElementById('cart-items').textContent = itemsCount;
  document.getElementById('cart-amount').textContent = cartTotal + ' DA';
  document.getElementById('checkout-btn').disabled = totalCount === 0;
}

function checkout() {
  if (Object.keys(cart).length === 0) return;

  const invoiceNum = Math.floor(Math.random() * 1000000);
  document.getElementById('invoice-number').textContent = invoiceNum;

  let invoiceHTML = '<div class="invoice-header"><span>المنتج</span><span>الكمية</span><span>السعر</span><span>المجموع</span></div>';
  for (let [id, item] of Object.entries(cart)) {
    invoiceHTML += `
      <div class="invoice-item">
        <div class="invoice-product-details">
          <span>${escHtml(item.name)}</span>
          <span class="invoice-product-code">${escHtml(item.code)}</span>
        </div>
        <span>${item.quantity}</span>
        <span>${item.price} DA</span>
        <span>${(item.price * item.quantity)} DA</span>
      </div>
    `;
  }

  document.getElementById('invoice-items').innerHTML = invoiceHTML;
  document.getElementById('final-total').innerHTML = 'المجموع النهائي: <span>' + cartTotal + ' DA</span>';
  document.getElementById('invoiceModal').classList.add('show');
}

function closeInvoice() {
  document.getElementById('invoiceModal').classList.remove('show');
  cart = {};
  cartTotal = 0;
  updateCart();
  renderProducts();
  refreshOpenCategoryHeight();
}

function getInvoiceText() {
  const invoiceNum = document.getElementById('invoice-number').textContent;
  let text = `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += `🧾 *فاتورة الشراء*\n`;
  text += `رقم الفاتورة: #${invoiceNum}\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  text += `📦 *المنتجات:*\n\n`;

  for (let [id, item] of Object.entries(cart)) {
    text += `▫️ ${item.name}\n`;
    text += `   الكود: [${item.code}]\n`;
    text += `   الكمية: ${item.quantity}\n`;
    text += `   السعر: ${item.price} DA\n`;
    text += `   المجموع: ${(item.price * item.quantity)} DA\n\n`;
  }

  text += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += `💰 *المجموع النهائي: ${cartTotal} DA*\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  text += `شكراً لاختيارك متجر نومادي للتوزيع\n`;
  text += `نتمنى لك تجربة تسوق ممتعة\n\n`;
  text += `*EURL NOMADI DISTRIBUTION*\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━`;

  return text;
}

function copyInvoice() {
  const text = getInvoiceText();
  navigator.clipboard.writeText(text).then(() => {
    const successMsg = document.getElementById('copy-success');
    successMsg.style.display = 'block';
    setTimeout(() => { successMsg.style.display = 'none'; }, 3000);
  });
}

function sendToDelegue() {
  const message = getInvoiceText();
  const encodedMessage = encodeURIComponent(message);
  window.open(`https://wa.me/000?text=${encodedMessage}`, '_blank');
}

function refreshOpenCategoryHeight() {
  if (openCategory) {
    const body = document.getElementById('body-' + openCategory);
    if (body) body.style.maxHeight = body.scrollHeight + 'px';
  }
}

// -------------------- Search --------------------
function normalizeText(s) {
  return String(s).toLowerCase();
}

function flattenAllProducts() {
  const all = [];
  for (let [category, items] of Object.entries(products)) {
    const cat = categoryMeta[category] || { ar: category, fr: category };
    for (const p of items) {
      const blob = normalizeText([p.name, p.code, p.brand, cat.ar, cat.fr].join(' '));
      all.push(Object.assign({}, p, { categoryAr: cat.ar, categoryFr: cat.fr, _blob: blob }));
    }
  }
  return all;
}

const allProductsFlat = flattenAllProducts();

document.getElementById('searchInput').addEventListener('input', (e) => {
  const rawQuery = e.target.value.trim();
  const resultsSection = document.getElementById('searchResultsSection');
  const categoriesContainer = document.getElementById('categoriesContainer');
  const grid = document.getElementById('searchResultsGrid');
  const countLabel = document.getElementById('searchResultsCount');

  if (rawQuery.length === 0) {
    resultsSection.style.display = 'none';
    categoriesContainer.style.display = 'block';
    return;
  }

  // Split the query into individual words - every word must appear somewhere
  // in the product's searchable text (name, reference, brand, category),
  // in any order, so word order in the search box doesn't matter.
  const words = normalizeText(rawQuery).split(/\s+/).filter(Boolean);

  const matches = allProductsFlat
    .filter(p => words.every(w => p._blob.includes(w)))
    .sort((a, b) => {
      const q = words[0];
      const aCode = a.code.toLowerCase() === normalizeText(rawQuery) ? 0 : 1;
      const bCode = b.code.toLowerCase() === normalizeText(rawQuery) ? 0 : 1;
      if (aCode !== bCode) return aCode - bCode;
      const aStarts = a._blob.startsWith(q) ? 0 : 1;
      const bStarts = b._blob.startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return 0;
    })
    .slice(0, 150);

  categoriesContainer.style.display = 'none';
  resultsSection.style.display = 'block';

  if (matches.length === 0) {
    countLabel.textContent = '';
    grid.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة لبحثك</div>';
  } else {
    countLabel.textContent = matches.length + ' نتيجة';
    grid.innerHTML = matches.map(productCardHTML).join('');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ------------------------------------------------------------------
// Cart badge dragging
// ------------------------------------------------------------------
const cartBadge = document.getElementById('cart-badge');
let isDragging = false;
let offsetX, offsetY;

cartBadge.addEventListener('mousedown', startDragging);
document.addEventListener('mousemove', drag);
document.addEventListener('mouseup', stopDragging);

cartBadge.addEventListener('touchstart', startDragging, {passive: false});
document.addEventListener('touchmove', drag, {passive: false});
document.addEventListener('touchend', stopDragging);

function startDragging(e) {
  if(e.target.tagName.toLowerCase() === 'button') return;

  isDragging = true;
  cartBadge.style.cursor = 'grabbing';

  const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

  const rect = cartBadge.getBoundingClientRect();
  offsetX = clientX - rect.left;
  offsetY = clientY - rect.top;

  cartBadge.style.bottom = 'auto';
  cartBadge.style.right = 'auto';
}

function drag(e) {
  if (!isDragging) return;
  e.preventDefault();

  const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

  let newX = clientX - offsetX;
  let newY = clientY - offsetY;

  newX = Math.max(0, Math.min(newX, window.innerWidth - cartBadge.offsetWidth));
  newY = Math.max(0, Math.min(newY, window.innerHeight - cartBadge.offsetHeight));

  cartBadge.style.left = newX + 'px';
  cartBadge.style.top = newY + 'px';
}

function stopDragging() {
  isDragging = false;
  cartBadge.style.cursor = 'grab';
}

renderProducts();
updateCart();

</script>
